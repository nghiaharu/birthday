<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎂 Chúc mừng sinh nhật Diệu Anh!!!!!!</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <meta name="description" content="Một chuyến du hành ngân hà 3D và lời chúc sinh nhật dành riêng cho Diệu Anh (Danh).">
    <meta property="og:title" content="🎂 Chúc mừng sinh nhật Diệu Anh!!!!!!">
    <meta property="og:description" content="Mở một món quà sinh nhật trong dải ngân hà 3D.">
    <meta property="og:image" content="https://nghiaharu.github.io/birthday/assets/photos/danh-01.jpg">
    <meta name="theme-color" content="#06031c">
</head>

<body>

    <div id="boot-wrapper">
        <div id="terminal-window">
            <div id="terminal-header">
                <span class="term-title">root@Dieu-anh-birthday:~</span>
                <div class="linux-controls">
                    <span class="l-btn">&#95;</span>
                    <span class="l-btn">&#9744;</span>
                    <span class="l-btn close">&#10005;</span>
                </div>
            </div>
            <div id="boot-screen"></div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>

    <div id="loading-screen">
        <div id="loading-logo">
            <div class="side-container left"><span>LOA</span></div>
            <div class="center-letter">D</div>
            <div class="side-container right"><span>ING</span></div>
        </div>
        <div class="spinner"></div>
    </div>

    <div id="intro-screen">
        <div class="envelope-wrapper">
            <div class="envelope-text">🎁 Danh ơi, Mở lẹ đi Danh!</div>
            <div class="envelope" id="envelope-btn">
                <div class="envelope-front"></div>
                <div class="envelope-flap"></div>
            </div>
        </div>
    </div>

    <div id="birthday-text"></div>
    <div id="sender-signature">— Một người bạn gửi đến Danhh ✨</div>
    <div id="canvas-container"></div>

    <div id="note-modal">
        <img id="modal-img" src="" alt="Memory">
        <div id="modal-text"></div>
        <button class="close-btn" onclick="closeModal()">Gấp lại</button>
    </div>

    <div id="hidden-modal">
        <h3>✉️ LỜI NHẮN CỦA DANH</h3>
        <p
            style="color: #cceeff; font-size: 14px; text-align: center; margin-bottom: 5px; font-family: 'Montserrat', sans-serif; line-height: 1.5;">
            Sao chép lời nhắn này để gửi cho người tặng nhé. Thiệp không tự gửi tin nhắn đi.
        </p>
        <div
            style="text-align: right; font-family: 'Dancing Script', cursive; font-size: 1.6rem; color: #0088ff; margin-bottom: 15px; margin-right: 10px; text-shadow: 0 0 5px rgba(0, 136, 255, 0.5);">
            — Danh —
        </div>
        <textarea id="hidden-input" rows="4" placeholder="Viết một lời nhắn tại đây..."></textarea>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
            <button class="h-btn close" onclick="closeHiddenModal()">HỦY</button>
            <button class="h-btn send" id="hidden-btn" onclick="sendHiddenMessage()">SAO CHÉP</button>
        </div>
    </div>


    <div id="toast-notification">
        <span class="toast-icon">&#10003;</span>
        <span>Đã sao chép lời nhắn! Bạn có thể gửi lại qua chat nhé.</span>
    </div>

    <audio id="bg-music" src="happy-birthday.mp3" preload="auto" playsinline loop></audio>
    <button id="music-toggle" type="button" aria-label="Bật hoặc tắt nhạc sinh nhật" title="Bật/Tắt nhạc sinh nhật" hidden>🔇</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script src="config.js"></script>

    <script src="js/3d/Environment.js"></script>
    <script src="js/3d/Particles.js"></script>
    <script src="js/3d/Gallery.js"></script>
    <script src="js/3d/Interaction.js"></script>

    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
